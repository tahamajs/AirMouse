<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="touchGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="680" rx="16" fill="#0b0f19"/>

  <!-- Device 1: Touchpad & Live Stats Screen -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Phone Bezel -->
    <rect width="280" height="580" rx="42" fill="url(#phoneBody)" stroke="#334155" stroke-width="4"/>
    <rect x="12" y="12" width="256" height="556" rx="32" fill="#030712"/>
    <!-- Screen Notch/Island -->
    <rect x="95" y="20" width="90" height="18" rx="9" fill="#111827"/>

    <!-- App Header -->
    <text x="32" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">AirMouse Touch</text>
    
    <!-- Status Pill -->
    <rect x="32" y="80" width="170" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="45" cy="93" r="4" fill="#10b981"/>
    <text x="56" y="97" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">WEBSOCKET • 3.2 ms</text>

    <!-- Main Touchpad Area -->
    <rect x="32" y="120" width="216" height="340" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Grid -->
    <line x1="140" y1="120" x2="140" y2="460" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="32" y1="290" x2="248" y2="290" stroke="#1e293b" stroke-dasharray="4"/>
    <circle cx="140" cy="270" r="28" fill="url(#touchGlow)" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="140" cy="270" r="6" fill="#38bdf8"/>
    <text x="75" y="440" font-family="sans-serif" font-size="11" fill="#64748b">1-Finger Move • 2-Finger Scroll</text>

    <!-- Virtual Mouse Buttons -->
    <rect x="32" y="475" width="66" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="48" y="501" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">LEFT</text>
    <rect x="107" y="475" width="66" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="122" y="501" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">MID</text>
    <rect x="182" y="475" width="66" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="195" y="501" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">RIGHT</text>
  </g>

  <!-- Device 2: ZUPT Sensor Calibration Screen -->
  <g transform="translate(410, 40)" filter="url(#shadow)">
    <rect width="280" height="580" rx="42" fill="url(#phoneBody)" stroke="#334155" stroke-width="4"/>
    <rect x="12" y="12" width="256" height="556" rx="32" fill="#030712"/>
    <rect x="95" y="20" width="90" height="18" rx="9" fill="#111827"/>

    <text x="32" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Sensor Calibration</text>
    <text x="32" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">Zero Velocity Update (ZUPT)</text>

    <!-- Calibration Target Graphic -->
    <circle cx="140" cy="210" r="70" fill="none" stroke="#1e293b" stroke-width="4"/>
    <circle cx="140" cy="210" r="50" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6"/>
    <circle cx="140" cy="210" r="14" fill="#10b981"/>
    <text x="78" y="315" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981">Calibration 100%</text>
    <text x="58" y="335" font-family="sans-serif" font-size="11" fill="#64748b">Stationary Hand Drift Cleared</text>

    <!-- Calibration Cards -->
    <rect x="32" y="365" width="216" height="48" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="46" y="394" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Gyroscope Bias</text>
    <text x="175" y="394" font-family="sans-serif" font-size="11" fill="#38bdf8">±0.002 rad/s</text>

    <rect x="32" y="425" width="216" height="48" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="46" y="454" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Accelerometer Noise</text>
    <text x="180" y="454" font-family="sans-serif" font-size="11" fill="#10b981">0.012 m/s²</text>

    <!-- Button -->
    <rect x="32" y="495" width="216" height="42" rx="10" fill="#2563eb"/>
    <text x="85" y="521" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Recalibrate (1s)</text>
  </g>

  <!-- Device 3: Settings & One Euro Filter Sliders -->
  <g transform="translate(760, 40)" filter="url(#shadow)">
    <rect width="280" height="580" rx="42" fill="url(#phoneBody)" stroke="#334155" stroke-width="4"/>
    <rect x="12" y="12" width="256" height="556" rx="32" fill="#030712"/>
    <rect x="95" y="20" width="90" height="18" rx="9" fill="#111827"/>

    <text x="32" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Motion Settings</text>
    <text x="32" y="85" font-family="sans-serif" font-size="11" fill="#94a3b8">One Euro Adaptive Smoothing</text>

    <!-- Preset Selector -->
    <rect x="32" y="110" width="66" height="28" rx="6" fill="#2563eb"/>
    <text x="42" y="128" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Gaming</text>
    <rect x="107" y="110" width="66" height="28" rx="6" fill="#1e293b"/>
    <text x="124" y="128" font-family="sans-serif" font-size="11" fill="#94a3b8">Office</text>
    <rect x="182" y="110" width="66" height="28" rx="6" fill="#1e293b"/>
    <text x="190" y="128" font-family="sans-serif" font-size="11" fill="#94a3b8">Precision</text>

    <!-- Sliders -->
    <text x="32" y="170" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Sensitivity (1.8x)</text>
    <rect x="32" y="180" width="216" height="6" rx="3" fill="#1e293b"/>
    <rect x="32" y="180" width="130" height="6" rx="3" fill="#38bdf8"/>
    <circle cx="162" cy="183" r="8" fill="#ffffff"/>

    <text x="32" y="225" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Min Cutoff Frequency (1.0 Hz)</text>
    <rect x="32" y="235" width="216" height="6" rx="3" fill="#1e293b"/>
    <rect x="32" y="235" width="90" height="6" rx="3" fill="#10b981"/>
    <circle cx="122" cy="238" r="8" fill="#ffffff"/>

    <text x="32" y="280" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Beta Adaptiveness (0.007)</text>
    <rect x="32" y="290" width="216" height="6" rx="3" fill="#1e293b"/>
    <rect x="32" y="290" width="110" height="6" rx="3" fill="#818cf8"/>
    <circle cx="142" cy="293" r="8" fill="#ffffff"/>

    <!-- Toggles -->
    <rect x="32" y="330" width="216" height="48" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="46" y="359" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Invert Vertical (Y)</text>
    <rect x="194" y="344" width="38" height="20" rx="10" fill="#1e293b"/>
    <circle cx="204" cy="354" r="7" fill="#64748b"/>

    <rect x="32" y="390" width="216" height="48" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="46" y="419" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Haptic Click Vibration</text>
    <rect x="194" y="404" width="38" height="20" rx="10" fill="#10b981"/>
    <circle cx="222" cy="414" r="7" fill="#ffffff"/>

    <rect x="32" y="450" width="216" height="48" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="46" y="479" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Screen Wake Lock</text>
    <rect x="194" y="464" width="38" height="20" rx="10" fill="#10b981"/>
    <circle cx="222" cy="474" r="7" fill="#ffffff"/>
  </g>
</svg>
