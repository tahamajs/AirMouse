<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="998" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="30" y="24" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="46" cy="40" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <text x="60" y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">SENSOR FUSION DSP ENGINE</text>

  <!-- Subtitle -->
  <text x="730" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">100Hz Real-Time Signal Conditioning</text>

  <!-- STAGE 1: Raw IMU Ingestion -->
  <g transform="translate(30, 80)">
    <rect width="170" height="230" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <text x="24" y="40" font-size="20">📡</text>
    <text x="60" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">1. Raw IMU</text>
    <text x="60" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11">Sensors HAL (100Hz)</text>
    <path d="M 20 100 Q 35 70 50 100 T 80 100 T 110 100 T 140 100" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="20" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">• Gyroscope (rad/s)</text>
    <text x="20" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">• Accelerometer (m/s²)</text>
    <text x="20" y="170" fill="#94a3b8" font-family="sans-serif" font-size="11">• Magnetometer (μT)</text>
    <rect x="18" y="195" width="134" height="22" rx="4" fill="#0f172a"/>
    <text x="28" y="210" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">Jitter: ±4.2° / sec</text>
  </g>

  <!-- Flow Arrow 1 -->
  <path d="M 205 195 L 225 195" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="225,190 235,195 225,200" fill="#38bdf8"/>

  <!-- STAGE 2: Bias Calibration & AHRS -->
  <g transform="translate(240, 80)">
    <rect width="170" height="230" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#7c3aed" fill-opacity="0.2"/>
    <text x="24" y="40" font-size="20">⚖️</text>
    <text x="60" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">2. AHRS Fusion</text>
    <text x="60" y="48" fill="#c084fc" font-family="sans-serif" font-size="11">Madgwick / Mahony</text>
    <circle cx="85" cy="95" r="24" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <path d="M 85 71 L 85 119 M 61 95 L 109 95" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="20" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11">• Quaternion Integration</text>
    <text x="20" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11">• Earth Gravity Removal</text>
    <text x="20" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">• Thermal Drift Offset</text>
    <rect x="18" y="195" width="134" height="22" rx="4" fill="#0f172a"/>
    <text x="28" y="210" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="600">Orientation: 6-DOF</text>
  </g>

  <!-- Flow Arrow 2 -->
  <polygon points="415,190 425,195 415,200" fill="#c084fc"/>

  <!-- STAGE 3: One Euro Filter -->
  <g transform="translate(430, 80)">
    <rect width="175" height="230" rx="12" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#0ea5e9" fill-opacity="0.2"/>
    <text x="24" y="40" font-size="20">🎯</text>
    <text x="60" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">3. 1€ Filter</text>
    <text x="60" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11">Adaptive Cutoff (fc)</text>
    <rect x="20" y="75" width="135" height="40" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="28" y="92" fill="#38bdf8" font-family="monospace" font-size="10">fc = fc_min + β|dx|</text>
    <text x="28" y="107" fill="#94a3b8" font-family="sans-serif" font-size="9">Dual-Speed Stabilization</text>
    <text x="20" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11">• Slow Aim: Zero Tremor</text>
    <text x="20" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11">• Fast Flick: Sub-1ms Lag</text>
    <text x="20" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">• Dynamic Derivative β</text>
    <rect x="18" y="195" width="139" height="22" rx="4" fill="#0f172a"/>
    <text x="26" y="210" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">Lag: &lt; 0.8ms</text>
  </g>

  <!-- Flow Arrow 3 -->
  <polygon points="610,190 620,195 610,200" fill="#10b981"/>

  <!-- STAGE 4: ZUPT (Zero-Velocity Update) -->
  <g transform="translate(625, 80)">
    <rect width="165" height="230" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#059669" fill-opacity="0.2"/>
    <text x="24" y="40" font-size="20">🛑</text>
    <text x="60" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">4. ZUPT Guard</text>
    <text x="60" y="48" fill="#34d399" font-family="sans-serif" font-size="11">Stationary Lock</text>
    <path d="M 25 95 L 145 95" stroke="#34d399" stroke-width="3"/>
    <circle cx="85" cy="95" r="10" fill="#059669" fill-opacity="0.4"/>
    <circle cx="85" cy="95" r="4" fill="#34d399"/>
    <text x="20" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11">• Variance &lt; 0.015 rad/s</text>
    <text x="20" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11">• Zero Creep Drift</text>
    <text x="20" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">• Auto Re-zeroing</text>
    <rect x="18" y="195" width="129" height="22" rx="4" fill="#0f172a"/>
    <text x="26" y="210" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">Creeping: 0.00 px/s</text>
  </g>

  <!-- Flow Arrow 4 -->
  <polygon points="795,190 805,195 795,200" fill="#f59e0b"/>

  <!-- STAGE 5: Protocol V2 Output -->
  <g transform="translate(810, 80)">
    <rect width="160" height="230" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#d97706" fill-opacity="0.2"/>
    <text x="24" y="40" font-size="20">🚀</text>
    <text x="60" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">5. Cursor Out</text>
    <text x="60" y="48" fill="#fbbf24" font-family="sans-serif" font-size="11">Protocol V2 Wire</text>
    <rect x="15" y="75" width="130" height="42" rx="4" fill="#0f172a"/>
    <text x="22" y="93" fill="#fbbf24" font-family="monospace" font-size="10">{dx: -3.42,</text>
    <text x="22" y="108" fill="#fbbf24" font-family="monospace" font-size="10"> dy: +1.18}</text>
    <text x="18" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11">• HMAC Signed</text>
    <text x="18" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11">• DROP_OLDEST Flow</text>
    <text x="18" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">• 60-120 FPS Native</text>
    <rect x="15" y="195" width="130" height="22" rx="4" fill="#0f172a"/>
    <text x="22" y="210" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600">Sub-ms Precision</text>
  </g>
</svg>
