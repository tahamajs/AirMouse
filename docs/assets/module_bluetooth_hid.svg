<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="btGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="998" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="30" y="24" width="310" height="32" rx="16" fill="#1e293b" stroke="#2563eb" stroke-width="1"/>
  <circle cx="46" cy="40" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <text x="60" y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">BLUETOOTH HID HARDWARE EMULATION</text>
  <text x="690" y="45" fill="#94a3b8" font-family="sans-serif" font-size="12">Zero-Server Standalone Bluetooth Mouse Mode</text>

  <!-- Phone Source (Left) -->
  <g transform="translate(40, 80)">
    <rect width="260" height="235" rx="12" fill="url(#cardGrad)" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="18" y="18" width="40" height="40" rx="8" fill="#1d4ed8" fill-opacity="0.25"/>
    <text x="26" y="46" font-size="22">📱</text>
    <text x="68" y="36" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Android HID Host</text>
    <text x="68" y="52" fill="#38bdf8" font-family="sans-serif" font-size="11">BluetoothProfile.HID_DEVICE</text>

    <!-- Descriptor Report -->
    <rect x="16" y="75" width="228" height="58" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="94" fill="#38bdf8" font-family="monospace" font-size="11">Byte 0: [Btns: L, R, M]</text>
    <text x="24" y="110" fill="#38bdf8" font-family="monospace" font-size="11">Byte 1: [ΔX (-127..127)]</text>
    <text x="24" y="124" fill="#38bdf8" font-family="monospace" font-size="11">Byte 2: [ΔY] | Byte 3: [Wheel]</text>

    <text x="20" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Native SDP Descriptor (0x01, 0x02)</text>
    <text x="20" y="172" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Zero Server Software Required</text>
    <text x="20" y="192" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Hardware Mouse Emulation</text>

    <!-- Metric Badge -->
    <rect x="16" y="202" width="228" height="22" rx="4" fill="#0f172a"/>
    <text x="32" y="217" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="600">Pure Bluetooth • No Wi-Fi Needed</text>
  </g>

  <!-- Wireless Wave Beam -->
  <g transform="translate(310, 180)">
    <!-- Bluetooth Icon Emblem -->
    <circle cx="45" cy="15" r="26" fill="#1d4ed8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="34" y="24" font-size="24" fill="#38bdf8">ᛒ</text>

    <!-- Radiating Waves -->
    <path d="M 80 -10 A 35 35 0 0 1 80 40" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 95 -25 A 55 55 0 0 1 95 55" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4"/>
  </g>

  <!-- Supported Target Devices (Right) -->
  <g transform="translate(430, 80)">
    <!-- Smart TVs -->
    <g transform="translate(0, 0)">
      <rect width="530" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="14" y="14" width="40" height="40" rx="8" fill="#1e293b"/>
      <text x="24" y="41" font-size="22">📺</text>
      <text x="64" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Smart TVs &amp; Media Boxes</text>
      <text x="64" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11">Android TV, Google TV, Apple TV, Samsung Tizen, LG webOS, Fire TV Stick</text>
      <rect x="420" y="20" width="96" height="26" rx="4" fill="#0f172a"/>
      <text x="430" y="37" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Plug &amp; Play</text>
    </g>

    <!-- Tablets & iPads -->
    <g transform="translate(0, 83)">
      <rect width="530" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="14" y="14" width="40" height="40" rx="8" fill="#1e293b"/>
      <text x="24" y="41" font-size="22">📱</text>
      <text x="64" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Apple iPad &amp; Android Tablets</text>
      <text x="64" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11">iPadOS Pointer support, Galaxy Tab, Lenovo tablets (Acts as Apple Magic Mouse)</text>
      <rect x="420" y="20" width="96" height="26" rx="4" fill="#0f172a"/>
      <text x="435" y="37" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">Zero-Install</text>
    </g>

    <!-- PCs, MacBooks, Steam Deck -->
    <g transform="translate(0, 166)">
      <rect width="530" height="68" rx="10" fill="url(#cardGrad)" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="14" y="14" width="40" height="40" rx="8" fill="#1d4ed8" fill-opacity="0.3"/>
      <text x="24" y="41" font-size="22">💻</text>
      <text x="64" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">PCs, MacBooks &amp; Handheld Gaming Consoles</text>
      <text x="64" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11">Windows 10/11, macOS, Linux, Steam Deck, ROG Ally (Hardware Bluetooth Stack)</text>
      <rect x="420" y="20" width="96" height="26" rx="4" fill="#0f172a"/>
      <text x="430" y="37" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">Standard HID</text>
    </g>
  </g>
</svg>
