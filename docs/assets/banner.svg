<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" rx="20" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="476" rx="18" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Network Graph Lines -->
  <path d="M100 240 Q 300 120 600 240 T 1100 240" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="3"/>
  <path d="M100 260 Q 400 380 700 240 T 1100 260" fill="none" stroke="#818cf8" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 150)">
    <rect width="180" height="180" rx="36" fill="#1e293b" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6"/>
    <!-- Stylized Spatial Mouse -->
    <path d="M90 35 C65 35 45 55 45 80 L45 100 C45 125 65 145 90 145 C115 145 135 125 135 100 L135 80 C135 55 115 35 90 35 Z" fill="none" stroke="url(#primaryGlow)" stroke-width="6"/>
    <line x1="90" y1="35" x2="90" y2="75" stroke="url(#primaryGlow)" stroke-width="6"/>
    <circle cx="90" cy="90" r="8" fill="#38bdf8"/>
    <!-- Sensor Waves -->
    <path d="M145 65 A 40 40 0 0 1 145 115" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <path d="M158 50 A 60 60 0 0 1 158 130" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Title & Typography -->
  <text x="320" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="-1.5">AirMouse <tspan fill="#38bdf8" font-size="34" font-weight="700">v2.1.0</tspan></text>
  <text x="320" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Ultra-Low Latency Spatial Air Mouse &amp; Multi-Touch Trackpad</text>
  <text x="320" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748b">Protocol V2 Canonical • Zero-CGO Go Server • Published PyPI Library • Android Compose &amp; iOS Safari</text>

  <!-- Feature Tags / Pills -->
  <g transform="translate(320, 310)">
    <!-- Pill 1: One Euro Filter -->
    <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ One Euro Filter</text>

    <!-- Pill 2: ZUPT Calibration -->
    <rect x="180" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="194" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#10b981">🎯 ZUPT Auto-Drift</text>

    <!-- Pill 3: TLS & HMAC -->
    <rect x="355" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="369" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#818cf8">🔒 TLS 1.2+ &amp; HMAC</text>

    <!-- Pill 4: iOS WakeLock -->
    <rect x="520" y="0" width="175" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="534" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#f59e0b">📱 iOS Screen WakeLock</text>

    <!-- Pill 5: Sub-Millimeter Precision -->
    <rect x="710" y="0" width="130" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="724" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#ec4899">&lt; 5ms Latency</text>
  </g>
</svg>
