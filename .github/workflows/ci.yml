name: AirMouse CI/CD & Repository Guardrails

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────────
  # 1. Documentation & Repository Guardrails Check
  # ──────────────────────────────────────────────────
  docs-check:
    name: Docs & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Documentation Verification Script
        run: |
          chmod +x scripts/check_docs.sh
          ./scripts/check_docs.sh

  # ──────────────────────────────────────────────────
  # 2. Go Server Matrix (Lint, Headless, GUI, ONNX, Tests & Coverage)
  # ──────────────────────────────────────────────────
  go-server:
    name: Go (${{ matrix.target }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Headless zero-CGO build (strict size budget <= 15MB)
          - target: headless
            os: ubuntu-latest
            cgo: "0"
            tags: "noai"
          # Standard GUI/desktop build with CGO
          - target: gui
            os: ubuntu-latest
            cgo: "1"
            tags: ""
          # ONNX inference build
          - target: onnx
            os: ubuntu-latest
            cgo: "1"
            tags: "ai,ml"
    defaults:
      run:
        working-directory: pc/airmouse_go_new

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: pc/airmouse_go_new/go.sum

      - name: Install Linux System Dependencies for GUI/CGO
        if: matrix.cgo == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev xdotool

      - name: Verify Go Modules
        run: |
          go mod download
          go mod verify

      - name: Run golangci-lint
        if: matrix.target == 'headless'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: pc/airmouse_go_new
          args: --timeout=5m

      - name: Build Binary (${{ matrix.target }})
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          TAGS_FLAG=""
          if [ -n "${{ matrix.tags }}" ]; then
            TAGS_FLAG="-tags ${{ matrix.tags }}"
          fi
          echo "Building binary with CGO_ENABLED=$CGO_ENABLED $TAGS_FLAG..."
          go build $TAGS_FLAG -ldflags="-s -w" -o airmouse-${{ matrix.target }} ./cmd/airmouse-server

      - name: Validate Binary Size Budget (Headless <= 15MB)
        if: matrix.target == 'headless'
        run: |
          MAX_SIZE=15728640 # 15 MB in bytes
          ACTUAL_SIZE=$(stat -c%s airmouse-headless 2>/dev/null || wc -c < airmouse-headless)
          ACTUAL_MB=$(awk "BEGIN {printf \"%.2f\", $ACTUAL_SIZE / 1048576}")
          echo "Headless binary size: ${ACTUAL_MB} MB ($ACTUAL_SIZE bytes)"
          if [ "$ACTUAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "❌ Headless binary exceeds 15MB budget!"
            exit 1
          fi
          echo "✅ Headless binary satisfies size budget (<= 15MB)"

      - name: Run Go Unit Tests & Generate Coverage Report
        if: matrix.target == 'headless'
        run: |
          echo "Running unit tests with race detection and statement coverage..."
          go test -v -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt

          TOTAL_COVERAGE=$(tail -n 1 coverage-summary.txt | awk '{print $NF}')
          echo "=============================================="
          echo "Total Statement Coverage: $TOTAL_COVERAGE"
          echo "=============================================="

          # Output markdown summary to GitHub Step Summary
          echo "### 🧪 Go Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Statement Coverage:** \`$TOTAL_COVERAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package / Function | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          grep -v '^total:' coverage-summary.txt | awk '{printf "| `%s` | `%s` |\n", $1, $3}' >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Coverage Artifact
        if: matrix.target == 'headless'
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: |
            pc/airmouse_go_new/coverage.out
            pc/airmouse_go_new/coverage-summary.txt
          retention-days: 14

  # ──────────────────────────────────────────────────
  # 3. Android Client (Lint & Unit Tests)
  # ──────────────────────────────────────────────────
  android-client:
    name: Android Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Android Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/network/build/reports/
          retention-days: 7
