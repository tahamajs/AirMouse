[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airmouse-core"
version = "2.0.0"
description = "High-performance, secure Python server and protocol engine for AirMouse remote input devices"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AirMouse Team"}
]
keywords = ["airmouse", "remote-input", "mouse", "imu", "websocket", "protocol-v2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "pynput>=1.7.6",
    "cryptography>=42.0.0",
    "websockets>=12.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
airmouse-server = "airmouse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["airmouse*", "core*", "network*", "security*", "ui*"]

[tool.setuptools.package-data]
airmouse = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
