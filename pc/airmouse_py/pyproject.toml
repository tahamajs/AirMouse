[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airmouse-core"
version = "2.1.0"
description = "High-performance, secure Python server and protocol engine for AirMouse remote input devices"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "AirMouse Team", email = "dev@airmouse.io"}
]
keywords = [
    "airmouse",
    "remote-mouse",
    "input-devices",
    "gyroscope",
    "accelerometer",
    "websocket",
    "tcp",
    "udp-discovery",
    "one-euro-filter",
    "jitter-buffer",
    "zero-latency",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "pynput>=1.7.6",
    "cryptography>=42.0.0",
    "websockets>=12.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/AirMouse/AirMouse"
Documentation = "https://github.com/AirMouse/AirMouse/tree/main/pc/airmouse_py"
Repository = "https://github.com/AirMouse/AirMouse.git"
Issues = "https://github.com/AirMouse/AirMouse/issues"
Changelog = "https://github.com/AirMouse/AirMouse/blob/main/CHANGELOG.md"

[project.scripts]
airmouse-server = "airmouse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["airmouse*", "core*", "network*", "security*", "ui*"]

[tool.setuptools.package-data]
airmouse = ["py.typed", "web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
